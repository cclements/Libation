# build-linux.yml
# Reusable workflow that builds the Linux and MacOS (x64 and arm64) versions of Libation.
---
name: build

on:
  workflow_call:
    inputs:
      libation-version:
        type: string
        required: true
      dotnet-version:
        type: string
        required: true
      run-unit-tests:
        type: boolean
      publish-r2r:
        type: boolean
      retention-days:
        type: number
      architecture:
        type: string
        description: "CPU architecture targeted by the build."
        required: true
      OS:
        type: string
        description: >
          The operating system targeted by the build.
          
          There must be a corresponding Bundle_$OS.sh script file in ./Scripts
        required: true

jobs:
  build:
    name: "${{ inputs.OS }}-${{ inputs.architecture }}"
    runs-on: ubuntu-latest
    env:
      RUNTIME_ID: "linux-${{ inputs.architecture }}"
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-quality: "ga"

      - name: Unit test
        if: ${{ inputs.run-unit-tests }}
        working-directory: ./Source
        env:
          LIBATION_HEADLESS_CAPTURE_OUTPUT: ${{ inputs.OS == 'Debian' && inputs.architecture == 'x64' && format('{0}/cross-platform-captures/linux-x64', github.workspace) || '' }}
        run: |
          shopt -s nullglob
          TEST_PROJECTS=(_Tests/*.Tests/*.csproj)
          if (( ${#TEST_PROJECTS[@]} == 0 )); then
            echo "::error::No unit-test projects were found."
            exit 1
          fi
          for TEST_PROJECT in "${TEST_PROJECTS[@]}"; do
            dotnet run --project "${TEST_PROJECT}" --configuration Release -- --minimum-expected-tests 1
          done

      - name: Upload Linux contemporary captures
        if: ${{ always() && inputs.run-unit-tests && inputs.OS == 'Debian' && inputs.architecture == 'x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: contemporary-captures-linux-x64
          path: ./cross-platform-captures/linux-x64/*.png
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - name: Publish
        id: publish
        working-directory: ./Source
        run: |
          PUBLISH_ARGS=(
            '--runtime' '${{ env.RUNTIME_ID }}'
            '--configuration' 'Release'
            '--output' '../bin'
            '-p:PublishProtocol=FileSystem'
            "-p:PublishReadyToRun=${{ inputs.publish-r2r }}"
            '-p:SelfContained=true')
            
          dotnet publish LibationAvalonia/LibationAvalonia.csproj "${PUBLISH_ARGS[@]}"
          dotnet publish LoadByOS/LinuxConfigApp/LinuxConfigApp.csproj "${PUBLISH_ARGS[@]}"
          dotnet publish LibationCli/LibationCli.csproj "${PUBLISH_ARGS[@]}"
          dotnet publish HangoverAvalonia/HangoverAvalonia.csproj "${PUBLISH_ARGS[@]}"

      - name: Build bundle
        id: bundle
        run: |
          SCRIPT=./Scripts/Bundle_${{ inputs.OS }}.sh
          chmod +rx ${SCRIPT}
          ${SCRIPT} ./bin "${{ inputs.libation-version }}" "${{ inputs.architecture }}"
          artifact=$(ls ./bundle)
          echo "artifact=${artifact}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: ./bundle/${{ steps.bundle.outputs.artifact }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
